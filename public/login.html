<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — CampusCare Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light">

  <div id="navbar-mount"></div>

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-5">
        <div class="card card-custom border-0 shadow-lg p-4 p-md-5">
          <div class="text-center mb-4">
            <img src="/images/logo.svg" alt="CampusCare Logo" height="48" class="mb-3">
            <h4 class="fw-bold">Sign In to CampusCare</h4>
            <p class="text-muted small">Enter your institutional credentials to access your dashboard</p>
          </div>

          <form id="login-form">
            <div class="mb-3">
              <label class="form-label small fw-semibold">Email Address</label>
              <div class="input-group">
                <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-envelope"></i></span>
                <input type="email" id="email" class="form-control border-start-0" placeholder="e.g. vedant@campuscare.edu" required>
              </div>
            </div>

            <div class="mb-3">
              <div class="d-flex justify-content-between align-items-center mb-1">
                <label class="form-label small fw-semibold mb-0">Password</label>
                <a href="javascript:void(0)" class="small text-decoration-none text-muted" onclick="showToast('For evaluation, use password: student123 or admin123', 'info')">Forgot?</a>
              </div>
              <div class="input-group">
                <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-lock"></i></span>
                <input type="password" id="password" class="form-control border-start-0" placeholder="••••••••" required>
              </div>
            </div>

            <button type="submit" id="submit-btn" class="btn btn-primary w-100 py-2 fw-semibold shadow-sm mb-3">
              Sign In to Account
            </button>

            <div class="text-center small text-muted">
              Don't have an account? <a href="/register.html" class="fw-semibold text-primary text-decoration-none">Create Account</a>
            </div>
          </form>

          <!-- 1-Click Demo Accounts Section -->
          <div class="mt-4 pt-3 border-top">
            <div class="text-center mb-2">
              <span class="badge bg-secondary-subtle text-secondary small px-3 py-1">Instant Demo Accounts</span>
            </div>
            <div class="d-grid gap-2">
              <button class="btn btn-outline-primary btn-sm text-start d-flex justify-content-between align-items-center" onclick="fillAndLogin('vedant@campuscare.edu', 'student123')">
                <span><i class="bi bi-mortarboard me-1"></i> Student: Vedant (Roll: 2407106)</span>
                <span class="badge bg-primary">Auto-Login</span>
              </button>
              <button class="btn btn-outline-warning text-dark btn-sm text-start d-flex justify-content-between align-items-center" onclick="fillAndLogin('deptadmin@campuscare.edu', 'admin123')">
                <span><i class="bi bi-person-badge me-1"></i> Dept Admin: Dr. Sandeep Kamble</span>
                <span class="badge bg-warning text-dark">Auto-Login</span>
              </button>
              <button class="btn btn-outline-danger btn-sm text-start d-flex justify-content-between align-items-center" onclick="fillAndLogin('admin@campuscare.edu', 'admin123')">
                <span><i class="bi bi-shield-lock me-1"></i> Super Admin: System Governance</span>
                <span class="badge bg-danger">Auto-Login</span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script>
    renderNavbar('login');
    redirectIfAuth();

    async function fillAndLogin(email, password) {
      document.getElementById('email').value = email;
      document.getElementById('password').value = password;
      await handleLogin(email, password);
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      await handleLogin(email, password);
    });

    async function handleLogin(email, password) {
      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Authenticating...';

      try {
        const res = await fetchAPI('/auth/login', {
          method: 'POST',
          body: { email, password }
        });
        showToast(res.message);
        setTimeout(() => {
          const urlParams = new URLSearchParams(window.location.search);
          const redirect = urlParams.get('redirect');
          window.location.href = redirect || res.redirectUrl;
        }, 500);
      } catch (err) {
        btn.disabled = false;
        btn.innerHTML = 'Sign In to Account';
        showToast(err.message, 'error');
      }
    }
  </script>
</body>
</html>
