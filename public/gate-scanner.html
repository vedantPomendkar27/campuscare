<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Gate Pass Scanner — CampusCare</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body class="bg-light">

  <div id="navbar-mount"></div>

  <main class="container py-4">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <!-- Header -->
        <div class="d-flex justify-content-between align-items-center mb-4">
          <div>
            <h3 class="fw-bold mb-1"><i class="bi bi-qr-code-scan text-primary me-2"></i> Event Entry Gate Scanner</h3>
            <p class="text-muted small mb-0">Live webcam scanner & manual validator for campus events attendance</p>
          </div>
          <a href="/admin-dashboard.html" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left me-1"></i> Admin Desk
          </a>
        </div>

        <!-- Scanner Card -->
        <div class="card card-custom p-4 shadow-sm mb-4">
          <div class="text-center mb-3">
            <div id="reader" style="width: 100%; max-width: 450px; margin: 0 auto; min-height: 250px; background: #0f172a; border-radius: 12px; overflow: hidden;"></div>
            <div class="d-flex justify-content-center gap-2 mt-3">
              <button class="btn btn-primary btn-sm fw-semibold" id="start-cam-btn" onclick="startScanner()">
                <i class="bi bi-camera-video me-1"></i> Start Camera Scanner
              </button>
              <button class="btn btn-outline-secondary btn-sm" id="stop-cam-btn" onclick="stopScanner()" style="display: none;">
                <i class="bi bi-camera-video-off me-1"></i> Stop Camera
              </button>
            </div>
          </div>

          <div class="text-center my-3 text-muted position-relative">
            <hr>
            <span class="position-absolute top-50 start-50 translate-middle bg-white px-3 small fw-bold text-secondary">OR MANUAL VERIFICATION</span>
          </div>

          <!-- Manual Verification Input Form -->
          <form id="manual-verify-form" class="mt-2">
            <label class="form-label small fw-semibold">Enter Ticket Code or Pass QR Hash:</label>
            <div class="input-group">
              <span class="input-group-text bg-white"><i class="bi bi-keyboard"></i></span>
              <input type="text" id="manual-code" class="form-control font-monospace" placeholder="e.g. EVT-2026-101-VED or SHA256-CC-..." required>
              <button class="btn btn-success fw-bold px-4" type="submit" id="verify-btn">
                <i class="bi bi-check2-circle me-1"></i> Validate Entry
              </button>
            </div>
            <div class="small text-muted mt-1">Tip for evaluation: Paste demo ticket code <code>EVT-2026-101-VED</code> or <code>EVT-2026-101-RAH</code> to verify instantly.</div>
          </form>
        </div>

        <!-- Verification Result Banner -->
        <div id="scan-result" style="display: none;">
          <!-- Dynamically populated -->
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script>
    renderNavbar('scanner');

    let html5QrcodeScanner = null;

    requireAuth(['dept_admin', 'super_admin']).then(user => {
      if (!user) return;
    });

    function startScanner() {
      const reader = document.getElementById('reader');
      const startBtn = document.getElementById('start-cam-btn');
      const stopBtn = document.getElementById('stop-cam-btn');

      html5QrcodeScanner = new Html5Qrcode("reader");
      const config = { fps: 10, qrbox: { width: 250, height: 250 } };

      html5QrcodeScanner.start(
        { facingMode: "environment" },
        config,
        (decodedText) => {
          verifyScannedPass(decodedText);
          stopScanner();
        },
        (errorMessage) => {
          // ignore scan frame errors
        }
      ).then(() => {
        startBtn.style.display = 'none';
        stopBtn.style.display = 'inline-block';
      }).catch(err => {
        showToast('Camera permission denied or camera unavailable. Please use the manual code validator below.', 'error');
      });
    }

    function stopScanner() {
      if (html5QrcodeScanner) {
        html5QrcodeScanner.stop().then(() => {
          document.getElementById('start-cam-btn').style.display = 'inline-block';
          document.getElementById('stop-cam-btn').style.display = 'none';
        }).catch(err => console.log(err));
      }
    }

    document.getElementById('manual-verify-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const code = document.getElementById('manual-code').value.trim();
      if (code) {
        await verifyScannedPass(code);
      }
    });

    async function verifyScannedPass(qrOrTicketCode) {
      const resultDiv = document.getElementById('scan-result');
      resultDiv.style.display = 'block';
      resultDiv.innerHTML = `
        <div class="card card-custom p-4 text-center">
          <div class="spinner-border text-primary mx-auto mb-2" role="status"></div>
          <div class="fw-semibold">Validating security token with database...</div>
        </div>
      `;

      try {
        const res = await fetchAPI('/events/verify-pass', {
          method: 'POST',
          body: { qr_string: qrOrTicketCode }
        });

        if (res.status === 'VERIFIED') {
          resultDiv.innerHTML = `
            <div class="card card-custom p-4 border-success border-2 shadow-lg bg-success-subtle mb-4">
              <div class="d-flex align-items-center gap-3">
                <div class="action-icon bg-success text-white fs-2 rounded-circle">
                  <i class="bi bi-check-lg"></i>
                </div>
                <div class="flex-grow-1">
                  <span class="badge bg-success fs-6 mb-1">ENTRY GRANTED • VALID PASS</span>
                  <h4 class="fw-bold text-success-emphasis mb-1">${res.pass.student_name}</h4>
                  <div class="small text-dark">Roll No: <strong>${res.pass.roll_number}</strong> • Dept: ${res.pass.student_dept}</div>
                  <div class="small text-muted mt-1">Event: <strong>${res.pass.event_title}</strong> (${res.pass.venue})</div>
                  <div class="small font-monospace text-muted mt-1">Ticket: ${res.pass.ticket_code} • Verified: ${new Date(res.pass.attended_at).toLocaleTimeString()}</div>
                </div>
              </div>
            </div>
          `;
          showToast('Pass Verified! Attendance recorded.');
        } else if (res.status === 'ALREADY_USED') {
          resultDiv.innerHTML = `
            <div class="card card-custom p-4 border-warning border-2 shadow-lg bg-warning-subtle mb-4">
              <div class="d-flex align-items-center gap-3">
                <div class="action-icon bg-warning text-dark fs-2 rounded-circle">
                  <i class="bi bi-exclamation-triangle-fill"></i>
                </div>
                <div class="flex-grow-1">
                  <span class="badge bg-warning text-dark fs-6 mb-1">DUPLICATE ENTRY PROHIBITED</span>
                  <h5 class="fw-bold text-dark mb-1">${res.message}</h5>
                  <div class="small text-dark">Student: <strong>${res.pass.student_name}</strong> (${res.pass.roll_number})</div>
                  <div class="small text-muted">First Checked In: ${res.pass.attended_at || 'Earlier today'}</div>
                </div>
              </div>
            </div>
          `;
          showToast('Warning: Duplicate pass scanned!', 'error');
        }
      } catch (err) {
        resultDiv.innerHTML = `
          <div class="card card-custom p-4 border-danger border-2 shadow-lg bg-danger-subtle mb-4">
            <div class="d-flex align-items-center gap-3">
              <div class="action-icon bg-danger text-white fs-2 rounded-circle">
                <i class="bi bi-x-lg"></i>
              </div>
              <div class="flex-grow-1">
                <span class="badge bg-danger fs-6 mb-1">INVALID PASS / ACCESS DENIED</span>
                <h5 class="fw-bold text-danger mb-1">${err.message}</h5>
                <div class="small text-muted">The scanned QR token or ticket code does not exist in the registration database.</div>
              </div>
            </div>
          </div>
        `;
        showToast('Invalid QR Pass', 'error');
      }
    }
  </script>
</body>
</html>
