<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration — CampusCare</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light">

  <div id="navbar-mount"></div>

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-9 col-lg-7">
        <div class="card card-custom border-0 shadow-lg p-4 p-md-5">
          <div class="text-center mb-4">
            <img src="/images/logo.svg" alt="CampusCare" height="44" class="mb-2">
            <h4 class="fw-bold">Create CampusCare Account</h4>
            <p class="text-muted small">Register to access student utility exchange, grievance desk, and event passes</p>
          </div>

          <form id="reg-form">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label small fw-semibold">Full Name *</label>
                <input type="text" id="full_name" class="form-control" placeholder="e.g. Vedant Pomendkar" required>
              </div>

              <div class="col-md-6">
                <label class="form-label small fw-semibold">Roll Number / Student ID *</label>
                <input type="text" id="roll_number" class="form-control" placeholder="e.g. 2407106" required>
              </div>

              <div class="col-md-6">
                <label class="form-label small fw-semibold">Department *</label>
                <select id="department" class="form-select" required>
                  <option value="Computer Science" selected>Computer Science (B.Sc. CS)</option>
                  <option value="Information Technology">Information Technology (B.Sc. IT)</option>
                  <option value="Management Studies">Management Studies (BMS)</option>
                  <option value="Commerce & Accounting">Commerce & Accounting (B.Com)</option>
                  <option value="Mass Media & Arts">Mass Media & Arts (BAMMC)</option>
                </select>
              </div>

              <div class="col-md-6">
                <label class="form-label small fw-semibold">Academic Year *</label>
                <select id="year_of_study" class="form-select" required>
                  <option value="T.Y.B.Sc. (CS)" selected>Third Year (Semester V/VI)</option>
                  <option value="S.Y.B.Sc. (CS)">Second Year (Semester III/IV)</option>
                  <option value="F.Y.B.Sc. (CS)">First Year (Semester I/II)</option>
                </select>
              </div>

              <div class="col-md-6">
                <label class="form-label small fw-semibold">Email Address *</label>
                <input type="email" id="email" class="form-control" placeholder="e.g. vedant@campuscare.edu" required>
              </div>

              <div class="col-md-6">
                <label class="form-label small fw-semibold">Phone Number</label>
                <input type="tel" id="phone" class="form-control" placeholder="e.g. +91 91375 88990">
              </div>

              <div class="col-md-6">
                <label class="form-label small fw-semibold">Account Role</label>
                <select id="role_name" class="form-select">
                  <option value="student" selected>Student</option>
                  <option value="dept_admin">Department Staff / Admin</option>
                </select>
              </div>

              <div class="col-md-6">
                <label class="form-label small fw-semibold">Password *</label>
                <input type="password" id="password" class="form-control" placeholder="At least 6 characters" minlength="6" required>
              </div>
            </div>

            <div class="form-check mt-4 mb-3">
              <input class="form-check-input" type="checkbox" id="agree-terms" required>
              <label class="form-check-label small text-muted" for="agree-terms">
                I confirm that I am an enrolled student or faculty of Thakur Ramnarayan College and agree to adhere to campus conduct guidelines.
              </label>
            </div>

            <button type="submit" id="reg-btn" class="btn btn-primary w-100 py-2 fw-semibold shadow-sm mb-3">
              Register Account
            </button>

            <div class="text-center small text-muted">
              Already registered? <a href="/login.html" class="fw-semibold text-primary text-decoration-none">Sign In Here</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script>
    renderNavbar('register');
    redirectIfAuth();

    document.getElementById('reg-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('reg-btn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Creating Account...';

      try {
        const payload = {
          full_name: document.getElementById('full_name').value,
          roll_number: document.getElementById('roll_number').value,
          department: document.getElementById('department').value,
          year_of_study: document.getElementById('year_of_study').value,
          email: document.getElementById('email').value,
          phone: document.getElementById('phone').value,
          role_name: document.getElementById('role_name').value,
          password: document.getElementById('password').value
        };

        const res = await fetchAPI('/auth/register', {
          method: 'POST',
          body: payload
        });

        showToast(res.message);
        setTimeout(() => {
          window.location.href = payload.role_name === 'student' ? '/dashboard.html' : '/admin-dashboard.html';
        }, 600);
      } catch (err) {
        btn.disabled = false;
        btn.innerHTML = 'Register Account';
        showToast(err.message, 'error');
      }
    });
  </script>
</body>
</html>
